{% extends 'ads/base.html' %}

{% block title %}Удаление объявления{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">Подтверждение удаления</h2>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить объявление <strong>"{{ object.title }}"</strong>?</p>
                <p>Это действие нельзя отменить.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'ad-detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
